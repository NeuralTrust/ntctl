# Source: neuraltrust-platform/templates/secrets-generator.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: neuraltrust-platform-secrets-generator
  namespace: neuraltrust
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: neuraltrust-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: secrets-generator
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuraltrust-platform
        app.kubernetes.io/component: secrets-generator
    spec:
      restartPolicy: Never
      serviceAccountName: neuraltrust-platform-secrets-generator
      imagePullSecrets:
        - name: gcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: generate
          image: "europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/app:v2.22.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: GENERATED_SECRET
              value: "platform-secrets"
            - name: SPEC_COMPONENTS
              value: "platform postgresql trustguard-client ingress alertengine datacore trustguard agentgateway clickhouse clickstack-collector databridge clickstack-ingest-gateway"
            - name: SPEC_LABEL
              value: "neuraltrust.ai/generator-spec"
            - name: SPEC_FORMAT
              value: "2"
            - name: PREVIOUS_SECRET
              value: "neuraltrust-generated"
            - name: PREVIOUS_TLS
              value: "{\"agentgateway-configsync-tls\":\"neuraltrust-generated-agentgateway-configsync-tls\",\"clickstack-ingest-gateway-tls\":\"neuraltrust-generated-clickstack-ingest-gateway-tls\",\"databridge-southbound-tls\":\"neuraltrust-generated-databridge-southbound-tls\",\"neuraltrust-ingress-tls\":\"neuraltrust-generated-ingress-tls\",\"trustguard-configsync-tls\":\"neuraltrust-generated-trustguard-configsync-tls\"}"
            - name: MARKER
              value: "neuraltrust.ai/secrets-generator"
            - name: OPERATOR_SECRETS
              value: ""
            - name: HOME
              value: /tmp
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
